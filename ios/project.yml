# Generate the Xcode project with:  cd ios && xcodegen
name: TxnBuddy
options:
  bundleIdPrefix: com.kushrike
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TxnBuddy:
    type: application
    platform: iOS
    scheme: {}          # shared scheme, so xcodebuild on CI finds it
    sources:
      - path: TxnBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kushrike.txnbuddy
        PRODUCT_NAME: TxnBuddy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: TxnBuddy/Info.plist
      properties:
        CFBundleDisplayName: TxnBuddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: TxnBuddy uses Face ID to lock your money data on this iPhone.
        UILaunchScreen:
          UIColorName: Bg
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
